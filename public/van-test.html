<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cook &amp; Run — 3D van lab test</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/van.css">
<style>
  html, body { margin: 0; height: 100%; background: #22262a; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hudroot { position: absolute; inset: 0; pointer-events: none; }
  #dbg { position: fixed; left: 50%; top: 0; transform: translateX(-50%); z-index: 20; display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
         font: 600 11px/1 system-ui, sans-serif; color: #f1ead8; padding: 4px 6px; background: rgba(34,38,42,.6); border-radius: 0 0 6px 6px; pointer-events: auto; }
  #dbg a, #dbg button { color: #d9a83a; text-decoration: none; padding: 3px 5px; border-radius: 4px; background: rgba(0,0,0,.25); border: 0; font: inherit; cursor: pointer; }
  #dbg a.on { background: #d9a83a; color: #22262a; }
  #dbg span { padding: 3px 4px; opacity: .8; font-variant-numeric: tabular-nums; }
  body.shot #dbg { display: none; }
  #dbg { top: auto; bottom: 0; border-radius: 6px 6px 0 0; }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<div id="stage">
  <canvas id="view" tabindex="-1"></canvas>
  <div id="hudroot"></div>
</div>
<div id="dbg"></div>
<script type="module">
// Harness for the 3D van lab (Agent VANWORLD).
//   van-test.html?z=300|2000|5000|6150|...  FakeSnapshots preset (moving van, cops chasing) — default 300
//   van-test.html?sim=1[&skip=40]           real GameSim + Autopilot (real feel/latAcc/bumps/inventory)
// Tab toggles van.setActive (with ?role=driver the inactive view is the driver's chase cam, like solo mode).
// Script flags: ?fire=1 ?fumes=1 ?cop=1 ?down=1 ?hp=40 ?at=stove[&work=1] ?run=street ?board=1 ?carry=1
//               ?curtains=1 ?vent=1 ?zoom=0|1|2 ?sway=1 ?freeze=1 ?shot=1 ?dt=0.033 (fixed step)
// Exposes window.__van, __lab, __view, __host, __gen, __sim, __advance(sec), __pause(bool), __stats(), __settled()
import { loadData } from './js/data/loadData.js';
import { WorldView } from './js/render/WorldView.js';
import { Hud } from './js/ui/hud.js';
import { FakeSnapshots, PRESETS } from './js/render/fakeSnapshots.js';
import { CookLab } from './js/cook/CookLab.js';
import { CMD, EV, KIND_ID } from './js/shared/protocol.js';
import { VanLab3D } from './js/van/VanLab3D.js';

const q = new URLSearchParams(location.search);
const useSim = q.get('sim') === '1';
const preset = q.get('z') || '300';
if (q.has('shot')) document.body.classList.add('shot');
const data = await loadData();
const seed = q.has('seed') ? +q.get('seed') : data.route.defaultSeed;

const canvas = document.getElementById('view');
const hudRoot = document.getElementById('hudroot');
const viewRole = q.get('role') === 'driver' ? 'driver' : 'cook';   // driver = solo-style (chase cam when the lab is off)
const view = new WorldView(canvas, data, { seed, role: viewRole });
const hud = new Hud(hudRoot, data, { role: viewRole });

// ── host: fake (scripted snapshots + inventory) or the real sim ────────────
const host = {
  inv: { mat: {}, units: q.has('units') ? +q.get('units') : 3, quality: 0.72, gadgets: { smoke: 1, oil: 1, nitro: 0 } },
  crew: { driver: 100, cook: 100 }, events: [], pending: new Map(), copForce: q.get('cop') === '1' ? true : null,
  cookDownFor: 0, bumpUntil: -1, bumpPow: 0, hp: q.has('hp') ? +q.get('hp') : null, commands: [],
};
for (const id of Object.keys(data.lab.ingredients)) host.inv.mat[id] = (data.lab.startInventory[id] || 0) + 2;
let sim = null, ap = null, gen = null;
if (useSim) {
  const { GameSim } = await import('./js/sim/GameSim.js');
  const { Autopilot } = await import('./js/sim/autopilot.js');
  sim = new GameSim(data, { seed, solo: true });
  ap = new Autopilot(data, { seed });
} else {
  gen = new FakeSnapshots(data, { seed, preset, role: 'cook', start: q.has('start') ? +q.get('start') : null, speed: q.has('speed') ? +q.get('speed') : null });
  gen.free = !q.has('freeze');
}

function sendCommand(cmd) {
  host.commands.push(cmd);
  if (sim) { sim.applyCookCommand(cmd); return; }
  switch (cmd.type) {
    case CMD.START_RECIPE: {
      const r = data.lab.recipes.find((x) => x.id === cmd.recipeId);
      const mat = host.inv.mat;
      const ok = r && Object.entries(r.needs).every(([k, n]) => (mat[k] || 0) >= n);
      if (ok) { for (const [k, n] of Object.entries(r.needs)) mat[k] -= n; host.pending.set(cmd.reqId, r); host.events.push({ type: EV.RECIPE_OK, reqId: cmd.reqId, recipeId: cmd.recipeId }); }
      else host.events.push({ type: EV.RECIPE_DENIED, reqId: cmd.reqId, recipeId: cmd.recipeId, reason: 'not enough ingredients' });
      break;
    }
    case CMD.RECIPE_DONE: {
      const r = host.pending.get(cmd.reqId) || data.lab.recipes.find((x) => x.id === cmd.recipeId);
      host.pending.delete(cmd.reqId);
      if (r.kind === 'product') { const u0 = host.inv.units, u1 = u0 + r.units; host.inv.quality = u1 ? (host.inv.quality * u0 + cmd.quality * r.units) / u1 : 0; host.inv.units = u1; }
      else if (r.kind === 'gadget') host.inv.gadgets[r.gadget] = (host.inv.gadgets[r.gadget] || 0) + 1;
      else if (r.repair?.crew) host.crew.cook = Math.min(100, host.crew.cook + r.repair.crew);
      else if (r.repair?.rv && host.hp != null) host.hp = Math.min(100, host.hp + r.repair.rv);
      break;
    }
    case CMD.RECIPE_FAIL: host.pending.delete(cmd.reqId); break;
    case CMD.EXPLOSION: host.crew.cook = Math.max(0, host.crew.cook - (data.lab.hazards.explosion?.cookDamage ?? 30)); break;
    default: break;
  }
}
const lab = new CookLab(data, { sendCommand, seed });
const van = new VanLab3D(view, lab, data, { canvas, hudRoot, role: 'cook' });
van.setActive(true);

// ── loop ──────────────────────────────────────────────────────────────────
let T = 0, lastSend = -1, simAcc = 0, labAcc = 0, lastSnap = null, paused = false;
const fixedDt = q.has('dt') ? +q.get('dt') : null;
function fakeSnap() {
  const s = gen.snapshot(T);
  s.inv = JSON.parse(JSON.stringify(host.inv));
  const ls = lab.getLabState();
  host.crew.cook = Math.max(0, host.crew.cook - ls.cookHurt);
  if (host.cookDownFor > 0) { host.cookDownFor -= 1 / 15; if (host.cookDownFor <= 0) host.crew.cook = Math.max(host.crew.cook, 25); }
  else if (host.crew.cook <= 0) host.cookDownFor = 12;
  s.crew = { ...host.crew, cookDown: host.cookDownFor > 0 };
  s.lab = { fumes: ls.fumes, fire: ls.fire, ventOpen: ls.ventOpen, curtains: ls.curtains, cooking: ls.cooking };
  if (host.hp != null) s.rv.hp = host.hp;
  // ?cops=8,18 → chasing patrol cars N metres behind (lights on), weaving a little
  if (q.get('cops')) q.get('cops').split(',').map(Number).forEach((d, i) => {
    const cz = s.rv.z - d, tr = gen.track, u = gen.laneU(cz, true, i % 2) + Math.sin(T * 0.8 + i) * 0.4;
    s.ents.push([900 + i, KIND_ID[i % 2 ? 'cop_suv' : 'cop'], tr.xAt(cz, u), 0, cz, tr.headingAt(cz) + Math.sin(T + i) * 0.05, 0, 1]);
  });
  if (host.copForce !== null) s.alert = { copClose: host.copForce, copDist: host.copForce ? 6 : 140 };
  if (q.has('sway')) s.feel.latAcc = Math.sin(T * 0.45) * 6.5;
  if (T < host.bumpUntil) s.feel.bump = Math.max(s.feel.bump, host.bumpPow);
  s.events = [...(s.events || []), ...host.events.splice(0)];
  return s;
}
function step(dt, draw = true) {
  if (sim) {
    simAcc += dt;
    let n = 0;
    while (simAcc >= 1 / 60 && n < 8) { sim.step(ap.update(lastSnap || sim.snapshot()), 1 / 60); simAcc -= 1 / 60; n++; }
    if (n === 8) simAcc = 0;
    const s = sim.snapshot();
    if (host.copForce !== null) s.alert = { copClose: host.copForce, copDist: 6 };
    if (T < host.bumpUntil) s.feel = { ...s.feel, bump: Math.max(s.feel.bump, host.bumpPow) };
    if (host.hp != null) s.rv.hp = host.hp;
    lastSnap = s;
    view.pushSnapshot(s, { interpolate: false });
    lab.applySnapshot(s);
    hud.update(s);
    labAcc += dt;
    if (labAcc >= 0.1) { labAcc = 0; sim.setLabState(lab.getLabState()); }
  } else if (T - lastSend >= 1 / 15 || !lastSnap) {
    lastSend = T;
    const s = fakeSnap();
    lastSnap = s;
    view.pushSnapshot(s, { interpolate: true });
    lab.applySnapshot(s);
    hud.update(s);
  }
  T += dt;
  lab.update(dt);
  van.update(dt, lastSnap);
  view.render(dt, { draw });
}
window.__advance = (sec, dt = 1 / 30) => { const n = Math.max(1, Math.round(sec / dt)); for (let i = 0; i < n; i++) step(dt, i === n - 1); };
window.__pause = (p = true) => { paused = p; };
window.__van = van; window.__lab = lab; window.__view = view; window.__host = host; window.__gen = gen; window.__sim = sim; window.__hud = hud;
window.__settled = () => view.isSettled() && van.built;
window.__stats = () => ({ calls: view.stats.calls, tris: view.stats.triangles, T: +T.toFixed(2), z: +(view.cur?.rv?.z ?? 0).toFixed(1), doc: van.doc ? van.doc.toJSON() : null, lab: lab.state, step: lab.getCurrentStep && lab.getCurrentStep(), fire: lab.fire, fumes: lab.fumes, units: lastSnap?.inv?.units });
window.__bump = (pow = 0.85, sec = 0.25) => { host.bumpUntil = T + sec; host.bumpPow = pow; };
window.__key = (code, down = true) => van.onKey({ code, repeat: false, preventDefault() {} }, down);

let last = performance.now();
function frame(now) {
  const dt = fixedDt ?? Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!paused) step(dt);
  if (stEl && Math.floor(now / 300) !== Math.floor((now - dt * 1000) / 300)) {
    const s = view.stats;
    stEl.textContent = `z ${(view.cur?.rv?.z ?? 0).toFixed(0)} · calls ${s.calls} · tris ${(s.triangles / 1000).toFixed(0)}k · doc ${van.docState} · lab ${lab.state}`;
  }
  requestAnimationFrame(frame);
}

// keyboard → van (never let the page scroll / focus things)
addEventListener('keydown', (e) => {
  if (e.code === 'Tab') { e.preventDefault(); van.setActive(!van.active); return; }   // solo-style toggle: lab ⇄ driving view
  if (van.onKey(e, true)) e.preventDefault(); else if (e.code === 'KeyP') paused = !paused; else if (e.code === 'KeyB') window.__bump(0.85);
});
addEventListener('keyup', (e) => { if (van.onKey(e, false)) e.preventDefault(); });
addEventListener('resize', () => view.resize());

// debug bar
const dbg = document.getElementById('dbg');
const link = (k, v) => { const u = new URLSearchParams(q); if (v == null) u.delete(k); else u.set(k, v); return '?' + u.toString(); };
dbg.innerHTML = Object.keys(PRESETS).filter((k) => k !== 'zoo').map((k) => `<a href="${link('z', k)}" class="${!useSim && k === preset ? 'on' : ''}">${k}</a>`).join('') +
  `<a href="${link('sim', useSim ? null : '1')}" class="${useSim ? 'on' : ''}">sim</a>` +
  `<button data-a="fire">fire</button><button data-a="bump">bump</button><button data-a="cop">cop</button><button data-a="down">KO</button><button data-a="fumes">fumes</button><button data-a="stock">stock</button><span id="st"></span>`;
const stEl = document.getElementById('st');
dbg.addEventListener('mousedown', (e) => e.preventDefault());
dbg.addEventListener('click', (e) => {
  const a = e.target.dataset?.a;
  if (a === 'fire') lab.startFire(0.3, 'test');
  if (a === 'bump') window.__bump(0.85);
  if (a === 'cop') host.copForce = host.copForce ? null : true;
  if (a === 'down') host.crew.cook = 0;
  if (a === 'fumes') lab.fumes = Math.min(1, lab.fumes + 0.4);
  if (a === 'stock') for (const id of Object.keys(data.lab.ingredients)) host.inv.mat[id] = (host.inv.mat[id] || 0) + 2;
});

await van.ready;
window.__advance(0.1);   // one host snapshot so the lab knows the inventory
// scripted states
if (q.get('zoom')) van.cam.setZoomIndex(+q.get('zoom'));
const at = q.get('at');
if (at && van.doc.byId[at]) { const st = van.doc.byId[at]; van.doc.x = st.stand.x; van.doc.z = st.stand.z; van.doc.yaw = van.doc.facingYawFor(at); }
if (q.get('vent') === '1') lab.toggleVent(true);
if (q.get('curtains') === '1') lab.toggleCurtains(true);
if (q.get('fumes')) lab.fumes = q.get('fumes') === '1' ? 0.88 : +q.get('fumes');
if (q.get('carry') === '1') van._grabExtinguisher();
if (q.get('down') === '1') host.crew.cook = 0;
if (q.get('run')) { lab.requestRecipe(q.get('run')); }
if (q.get('fire')) lab.startFire(q.get('fire') === '1' ? 0.45 : +q.get('fire'), 'test');
if (q.get('board') === '1') { const st = van.doc.byId.recipe; van.doc.x = st.stand.x; van.doc.z = st.stand.z; van._interact('recipe'); }
if (q.get('work') === '1' && at) { window.__advance(0.3); van._interact(at); }
if (q.has('skip') && sim) { const n = +q.get('skip') * 60; for (let i = 0; i < n; i++) { sim.step(ap.update(lastSnap || sim.snapshot()), 1 / 60); if (i % 6 === 0) lastSnap = sim.snapshot(); } lastSnap = sim.snapshot(); }
requestAnimationFrame(frame);
</script>
</body>
</html>
