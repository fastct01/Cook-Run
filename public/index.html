<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#22262a">
<meta name="description" content="Cook & Run — a two-player co-op road chase. One drives the RV, one runs the mobile lab in the back.">
<title>Cook &amp; Run</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='18' width='50' height='28' rx='4' fill='%23e9e2cf'/%3E%3Crect x='4' y='36' width='50' height='6' fill='%234f8f8a'/%3E%3Crect x='42' y='22' width='10' height='9' fill='%232e3a40'/%3E%3Crect x='12' y='10' width='4' height='10' fill='%23888'/%3E%3Ccircle cx='16' cy='48' r='6' fill='%2322262a'/%3E%3Ccircle cx='44' cy='48' r='6' fill='%2322262a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/cook.css">
<link rel="stylesheet" href="css/lobby.css">
<link rel="stylesheet" href="css/van.css">
<link rel="stylesheet" href="css/onfoot.css">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<div id="game" hidden>
  <div id="viewWrap">
    <canvas id="view" aria-label="Game view"></canvas>
    <div id="hud"></div>
    <div id="touch" aria-hidden="true"></div>
  </div>
  <div id="labWrap">
    <button type="button" id="labToggle" tabindex="-1" title="Show / hide the lab (Tab)">LAB</button>
    <div id="lab"></div>
  </div>
  <div id="overlay" hidden></div>
</div>
<div id="menu"></div>
<!-- #boot (LOBBY): the loading screen = a static frame of the title scene + a loading bar (styles in css/lobby.css).
     main.js: #boot.gone hides it, #boot.error + .boot-msg text shows an error, window.__bootProgress(0..1) moves the bar. -->
<div id="boot" class="crb">
  <link rel="preload" href="vendor/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
  <div class="crb-scene" aria-hidden="true"></div>
  <div class="crb-front">
    <div class="crb-brand">
      <div class="crl-logo" role="img" aria-label="Cook and Run"><span class="crl-logo-l1" aria-hidden="true">Cook</span><span class="crl-logo-l2" aria-hidden="true"><span class="crl-amp">&amp;</span>Run</span></div>
      <p class="crl-tagline">One drives. One cooks. Nobody gets busted.</p>
    </div>
    <section class="crb-load" role="status" aria-label="Loading">
      <div class="crb-row">
        <span class="crl-label crb-ok">Loading</span><span class="crl-label crb-err">Can’t start</span>
        <span class="crb-msgs"><span>Paving 40 km of desert road</span><span>Stocking the lab in the back</span><span>Waking up the county cops</span></span>
        <span class="crb-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <p class="boot-msg"></p>
      <div class="crb-track" aria-hidden="true"><i class="crb-fill"></i><span class="crb-ride"><svg viewBox="0 0 22 12"><path d="M1.5 3.2A2 2 0 0 1 3.5 1.2H15.5L19.4 4.6H21V9H1.5z" fill="#F1ECE4" stroke="#0E0F11" stroke-width="1"/><rect x="4" y="3" width="4" height="2.4" rx=".5" fill="#0E0F11"/><rect x="9.5" y="3" width="4" height="2.4" rx=".5" fill="#0E0F11"/><path d="M15.6 3h1.4l1.4 1.6h-2.8z" fill="#0E0F11"/><rect x="1.5" y="6.4" width="19.5" height="1.2" fill="#5FB3A8"/><circle cx="5.5" cy="9.6" r="1.8" fill="#0E0F11"/><circle cx="16.5" cy="9.6" r="1.8" fill="#0E0F11"/></svg></span></div>
    </section>
  </div>
  <script>
    // window.__bootProgress(p): p = 0..1, never moves backwards. Until main.js reports real progress the bar
    // creeps toward 85 % on its own (module download time is unknown up front).
    (function () {
      var b = document.getElementById('boot');
      if (!b) return;
      var fill = b.querySelector('.crb-fill'), ride = b.querySelector('.crb-ride');
      var p = 0, real = false, t0 = Date.now();
      function set(v) {
        v = Math.max(0, Math.min(1, +v || 0));
        if (v < p) return;
        p = v;
        if (fill) fill.style.transform = 'scaleX(' + v.toFixed(3) + ')';
        if (ride) ride.style.transform = 'translateX(' + (v * 100).toFixed(1) + '%)';
        b.style.setProperty('--boot-p', v.toFixed(3));
      }
      window.__bootProgress = function (v) { real = true; set(v); };
      (function creep() {
        if (real || b.classList.contains('gone')) return;
        set(0.85 * (1 - Math.exp(-(Date.now() - t0) / 2600)));
        setTimeout(creep, 180);
      })();
    })();
  </script>
</div>
<noscript><p style="color:#f1ead8;font:16px system-ui;padding:24px">Cook &amp; Run needs JavaScript and WebGL.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
