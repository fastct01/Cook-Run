<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Van cook presenters — bench</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1918; color: #f1ead8; font-family: Inter, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #label {
      position: fixed; left: 12px; top: 12px; z-index: 5; max-width: min(420px, calc(100vw - 24px));
      padding: 10px 12px; border-radius: 10px; background: rgba(22, 25, 28, 0.82); box-shadow: 0 6px 24px rgba(0,0,0,.35);
      font-size: 13px; line-height: 1.35; pointer-events: none;
    }
    #label b { color: #d9a83a; }
    #label .step { font: 800 15px Inter, system-ui, sans-serif; color: #f1ead8; }
    #label .hint { color: #cfe7d8; font-weight: 700; margin-top: 2px; }
    #label .ins { color: #e9dcc0; margin-top: 2px; }
    #label .bar { height: 6px; border-radius: 3px; background: #3a3f44; margin: 6px 0 2px; overflow: hidden; }
    #label .bar i { display: block; height: 100%; width: 0; background: #8fb36a; }
    #label .meta { color: #9a958a; font-size: 11px; margin-top: 4px; }
    #nav { position: fixed; right: 10px; top: 10px; z-index: 6; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; }
    #nav a { font: 700 11px Inter, sans-serif; color: #e9dcc0; text-decoration: none; padding: 4px 7px; border-radius: 6px; background: rgba(22,25,28,.7); }
    #nav a.on { background: #d9a83a; color: #22262a; }
    body.shots #nav, body.shots #label .meta { display: none; }
    .tile-label { position: fixed; z-index: 4; font: 800 13px Inter, sans-serif; color: #f1ead8; padding: 3px 8px; border-radius: 6px; background: rgba(22,25,28,.78); pointer-events: none; }
  </style>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
  <canvas id="cv"></canvas>
  <div id="label">loading…</div>
  <nav id="nav"></nav>
  <script type="module" src="./js/van/presenters/test/bench.js"></script>
</body>
</html>
